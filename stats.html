<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AE Research Scholars — Program Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.2rem;
  text-align: center;
}
.stat-number {
  font-family: 'Roboto Slab', Georgia, serif;
  font-size: 2.2rem;
  font-weight: 600;
  color: var(--navy);
  line-height: 1.2;
}
.stat-label {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-top: 0.3rem;
}

.tab-bar {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  padding: 0.6rem 1.2rem;
  font-size: 0.88rem;
  font-weight: 500;
  font-family: inherit;
  border: none;
  background: none;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  color: var(--navy);
  border-bottom-color: var(--navy);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.chart-section {
  margin-bottom: 2.5rem;
}
.chart-section h3 {
  font-family: 'Roboto Slab', Georgia, serif;
  font-size: 1.1rem;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 1rem;
  border-bottom: 2px solid var(--gold);
  padding-bottom: 0.4rem;
}
.bar-chart {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.bar-row {
  display: grid;
  grid-template-columns: 160px 1fr 40px;
  align-items: center;
  gap: 0.75rem;
}
.bar-label {
  font-size: 0.88rem;
  color: var(--text);
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-track {
  height: 24px;
  background: var(--sand);
  border-radius: 3px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--navy);
  border-radius: 3px;
  min-width: 2px;
  transition: width 0.4s ease;
}
.bar-fill--accent { background: var(--gold); }
.bar-fill--success { background: var(--success); }
.bar-value {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text);
  text-align: right;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  margin-top: 0.5rem;
}
.data-table th,
.data-table td {
  text-align: left;
  padding: 0.5rem 0.8rem;
  border-bottom: 1px solid var(--border);
}
.data-table th {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  font-weight: 600;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.data-table tr:hover td { background: var(--sand); }
.data-table td.num {
  text-align: center;
  font-weight: 600;
}
.table-wrap { overflow-x: auto; }

.loading-msg {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-secondary);
}

.conversion {
  font-size: 0.88rem;
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
}
.conversion strong {
  color: var(--navy);
  font-size: 1.1rem;
}

@media (max-width: 600px) {
  .bar-row {
    grid-template-columns: 100px 1fr 36px;
  }
  .bar-label { font-size: 0.8rem; }
  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .tab-btn { padding: 0.5rem 0.8rem; font-size: 0.82rem; }
}
</style>
</head>
<body>

<header class="hero hero--compact" style="border-bottom:2px solid var(--hero-accent);">
  <div class="hero-inner">
    <p class="hero-eyebrow">AE Research Scholars</p>
    <h1>Program Dashboard</h1>
  </div>
</header>

<section class="section">
  <div class="section-inner">
    <p style="margin-bottom:0.5rem;color:var(--text-secondary);">
      All-time program statistics. Placements reflect students with funding recorded.
    </p>
    <p style="margin-bottom:1.5rem;">
      <button class="btn btn-secondary" onclick="loadDashboard()" style="font-size:0.82rem;padding:0.35rem 0.8rem;">Refresh</button>
    </p>

    <div id="dashboard-content">
      <p class="loading-msg">Loading data...</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <p>AE Research Scholars Program &middot; Department of Architectural Engineering &middot; Penn State</p>
</footer>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxl3x4KWmjHufkroWiXieWjBcACjWxSguj9EjonvpSxPDfVUYhfg88uhnVjRMhXuAJx/exec';
var API_KEY = 'U50J4N2YOVeJ1-LaOvlrt9hkQMNJEqet';
var OPTIONS = ['Structures', 'Mechanical / Energy', 'Lighting / Electrical', 'Construction'];

function fetchJSON(action) {
  return fetch(SCRIPT_URL + '?key=' + encodeURIComponent(API_KEY) + '&action=' + action)
    .then(function (r) {
      if (!r.ok) throw new Error(action + ': HTTP ' + r.status);
      return r.text();
    })
    .then(function (text) {
      try { return JSON.parse(text); }
      catch (e) { throw new Error(action + ': invalid JSON — ' + text.substring(0, 120)); }
    });
}

function loadDashboard() {
  var container = document.getElementById('dashboard-content');
  container.innerHTML = '<p class="loading-msg">Loading data...</p>';

  fetchJSON('students')
    .then(function (students) {
      return fetchJSON('placements').then(function (placements) {
        render(students, placements);
      });
    })
    .catch(function (err) {
      console.error(err);
      container.innerHTML = '<p class="loading-msg" style="color:var(--error);">' + escapeHtml(String(err)) + '</p>';
    });
}

function render(students, placements) {
  var container = document.getElementById('dashboard-content');

  // Index students by email for cross-referencing
  var studentByEmail = {};
  students.forEach(function (s) {
    studentByEmail[s.email.toLowerCase()] = s;
  });

  // Build placed student list with their applicant data
  var placedEmails = {};
  var placedStudents = [];
  placements.forEach(function (p) {
    var email = (p['Student Email'] || '').toLowerCase();
    if (!email || placedEmails[email]) return;
    placedEmails[email] = true;
    var applicant = studentByEmail[email] || {};
    placedStudents.push({
      name: p['Student Name'] || applicant.name || '',
      email: email,
      faculty: p['Faculty Name'] || '',
      gradYear: applicant.gradYear || null,
      major: applicant.major || '',
      interests: applicant.interests || {},
      periodType: p['Period Type'] || '',
      fund1: p['Period 1 Fund'] || '',
      fund2: p['Period 2 Fund'] || '',
      label1: p['Period 1 Label'] || '',
      label2: p['Period 2 Label'] || ''
    });
  });

  // Faculty placement counts (including multi-placements)
  var placedFaculty = {};
  placements.forEach(function (p) {
    var f = p['Faculty Name'] || '';
    if (f) placedFaculty[f] = (placedFaculty[f] || 0) + 1;
  });

  // ── Tabs shell ──
  var html = '';
  html += '<div class="tab-bar">';
  html += '<button class="tab-btn active" data-tab="applicants">Applicants</button>';
  html += '<button class="tab-btn" data-tab="placed">Placed Students</button>';
  html += '</div>';

  // ══════════════════════════════════════════
  //  TAB 1: APPLICANTS
  // ══════════════════════════════════════════
  html += '<div class="tab-panel active" id="tab-applicants">';

  // Summary cards
  var withPref = students.filter(function (s) { return s.facultyPref; }).length;
  html += '<div class="stat-grid">';
  html += statCard(students.length, 'Total Applicants');
  html += statCard(placedStudents.length, 'Students Placed');
  html += statCard(withPref, 'Named a Faculty Pref');
  html += statCard(Object.keys(placedFaculty).length, 'Faculty with Placements');
  html += '</div>';

  // Interest by research area
  var highInterest = {};
  OPTIONS.forEach(function (o) { highInterest[o] = 0; });
  students.forEach(function (s) {
    OPTIONS.forEach(function (o) {
      if ((s.interests || {})[o] === 'High') highInterest[o]++;
    });
  });
  var maxInterest = Math.max.apply(null, OPTIONS.map(function (o) { return highInterest[o]; }));
  html += '<div class="chart-section">';
  html += '<h3>Interest by Research Area</h3>';
  html += '<p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:0.75rem;">Students who rated each area as &ldquo;High&rdquo; interest. One student can select multiple.</p>';
  html += '<div class="bar-chart">';
  OPTIONS.forEach(function (o) { html += barRow(o, highInterest[o], maxInterest || 1); });
  html += '</div></div>';

  // Graduation year
  var gradYears = {};
  students.forEach(function (s) { if (s.gradYear) gradYears[s.gradYear] = (gradYears[s.gradYear] || 0) + 1; });
  var sortedYears = Object.keys(gradYears).sort();
  if (sortedYears.length) {
    var maxYear = Math.max.apply(null, sortedYears.map(function (y) { return gradYears[y]; }));
    html += '<div class="chart-section"><h3>Graduation Year</h3><div class="bar-chart">';
    sortedYears.forEach(function (y) { html += barRow(y, gradYears[y], maxYear || 1, 'accent'); });
    html += '</div></div>';
  }

  // Major
  var majors = {};
  students.forEach(function (s) { var m = s.major || 'Not specified'; majors[m] = (majors[m] || 0) + 1; });
  var sortedMajors = Object.keys(majors).sort(function (a, b) { return majors[b] - majors[a]; });
  if (sortedMajors.length) {
    html += '<div class="chart-section"><h3>Major</h3><div class="bar-chart">';
    sortedMajors.forEach(function (m) { html += barRow(m, majors[m], majors[sortedMajors[0]] || 1); });
    html += '</div></div>';
  }

  // Applications by month
  var byMonth = {};
  students.forEach(function (s) {
    if (s.applied) {
      var d = new Date(s.applied);
      var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      byMonth[key] = (byMonth[key] || 0) + 1;
    }
  });
  var sortedMonths = Object.keys(byMonth).sort();
  if (sortedMonths.length) {
    var maxMonth = Math.max.apply(null, sortedMonths.map(function (m) { return byMonth[m]; }));
    html += '<div class="chart-section"><h3>Applications by Month</h3><div class="bar-chart">';
    sortedMonths.forEach(function (m) {
      var parts = m.split('-');
      html += barRow(monthName(parseInt(parts[1])) + ' ' + parts[0], byMonth[m], maxMonth || 1, 'accent');
    });
    html += '</div></div>';
  }

  html += '</div>'; // end tab-applicants

  // ══════════════════════════════════════════
  //  TAB 2: PLACED STUDENTS
  // ══════════════════════════════════════════
  html += '<div class="tab-panel" id="tab-placed">';

  if (!placedStudents.length) {
    html += '<p class="loading-msg">No placements recorded yet.</p>';
  } else {
    // Summary cards
    var deptMatchCount = 0;
    var piFundedBoth = 0;
    placements.forEach(function (p) {
      var f1 = (p['Period 1 Fund'] || '').toLowerCase();
      var f2 = (p['Period 2 Fund'] || '').toLowerCase();
      if (f1.indexOf('dept') !== -1 || f2.indexOf('dept') !== -1) deptMatchCount++;
      else if (f1 && f2) piFundedBoth++;
    });

    html += '<div class="stat-grid">';
    html += statCard(placedStudents.length, 'Students Placed');
    html += statCard(placements.length, 'Total Placements');
    html += statCard(Object.keys(placedFaculty).length, 'Faculty Mentors');
    html += statCard(deptMatchCount, 'Dept Match');
    html += '</div>';

    // Conversion rate
    if (students.length) {
      var pct = (placedStudents.length / students.length * 100).toFixed(0);
      html += '<p class="conversion"><strong>' + pct + '%</strong> placement rate (' + placedStudents.length + ' of ' + students.length + ' applicants)</p>';
    }

    // Placements by faculty
    html += '<div class="chart-section"><h3>Placements by Faculty</h3>';
    var sortedFaculty = Object.keys(placedFaculty).sort(function (a, b) { return placedFaculty[b] - placedFaculty[a]; });
    var maxFac = placedFaculty[sortedFaculty[0]] || 1;
    html += '<div class="bar-chart">';
    sortedFaculty.forEach(function (f) { html += barRow(f, placedFaculty[f], maxFac, 'success'); });
    html += '</div></div>';

    // Placed students' interests
    var placedHighInterest = {};
    OPTIONS.forEach(function (o) { placedHighInterest[o] = 0; });
    placedStudents.forEach(function (s) {
      OPTIONS.forEach(function (o) {
        if ((s.interests || {})[o] === 'High') placedHighInterest[o]++;
      });
    });
    var maxPInterest = Math.max.apply(null, OPTIONS.map(function (o) { return placedHighInterest[o]; }));
    html += '<div class="chart-section"><h3>Placed Students by Research Area</h3>';
    html += '<p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:0.75rem;">Research areas placed students rated as &ldquo;High&rdquo; interest when they applied.</p>';
    html += '<div class="bar-chart">';
    OPTIONS.forEach(function (o) { html += barRow(o, placedHighInterest[o], maxPInterest || 1); });
    html += '</div></div>';

    // Placed students' graduation year
    var pGradYears = {};
    placedStudents.forEach(function (s) { if (s.gradYear) pGradYears[s.gradYear] = (pGradYears[s.gradYear] || 0) + 1; });
    var pSortedYears = Object.keys(pGradYears).sort();
    if (pSortedYears.length) {
      var pMaxYear = Math.max.apply(null, pSortedYears.map(function (y) { return pGradYears[y]; }));
      html += '<div class="chart-section"><h3>Placed Students by Graduation Year</h3><div class="bar-chart">';
      pSortedYears.forEach(function (y) { html += barRow(y, pGradYears[y], pMaxYear || 1, 'accent'); });
      html += '</div></div>';
    }

    // Placed students' major
    var pMajors = {};
    placedStudents.forEach(function (s) { var m = s.major || 'Not specified'; pMajors[m] = (pMajors[m] || 0) + 1; });
    var pSortedMajors = Object.keys(pMajors).sort(function (a, b) { return pMajors[b] - pMajors[a]; });
    if (pSortedMajors.length) {
      html += '<div class="chart-section"><h3>Placed Students by Major</h3><div class="bar-chart">';
      pSortedMajors.forEach(function (m) { html += barRow(m, pMajors[m], pMajors[pSortedMajors[0]] || 1); });
      html += '</div></div>';
    }

    // Funding breakdown
    var fundingTypes = { 'Dept match': 0, 'PI funded': 0, 'Mixed / other': 0 };
    placements.forEach(function (p) {
      var f1 = (p['Period 1 Fund'] || '').toLowerCase();
      var f2 = (p['Period 2 Fund'] || '').toLowerCase();
      var hasDept = f1.indexOf('dept') !== -1 || f1.indexOf('besure') !== -1 || f2.indexOf('dept') !== -1 || f2.indexOf('besure') !== -1;
      var hasPI = (f1 && f1.indexOf('dept') === -1 && f1.indexOf('besure') === -1) || (f2 && f2.indexOf('dept') === -1 && f2.indexOf('besure') === -1);
      if (hasDept && hasPI) fundingTypes['Mixed / other']++;
      else if (hasDept) fundingTypes['Dept match']++;
      else if (hasPI) fundingTypes['PI funded']++;
      else fundingTypes['Mixed / other']++;
    });
    var maxFund = Math.max(fundingTypes['Dept match'], fundingTypes['PI funded'], fundingTypes['Mixed / other']);
    html += '<div class="chart-section"><h3>Funding Source</h3>';
    html += '<p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:0.75rem;">&ldquo;Mixed&rdquo; means one semester is department-matched and the other is PI-funded (the typical arrangement).</p>';
    html += '<div class="bar-chart">';
    ['Mixed / other', 'Dept match', 'PI funded'].forEach(function (k) {
      if (fundingTypes[k]) html += barRow(k, fundingTypes[k], maxFund || 1, k === 'Dept match' ? 'accent' : k === 'PI funded' ? 'success' : '');
    });
    html += '</div></div>';

    // Full roster table
    html += '<div class="chart-section"><h3>All Placed Students</h3>';
    html += '<div class="table-wrap"><table class="data-table">';
    html += '<thead><tr><th>Student</th><th>Faculty</th><th>Year</th><th>Major</th><th>Funding</th></tr></thead><tbody>';
    placedStudents.sort(function (a, b) { return a.name.localeCompare(b.name); });
    placedStudents.forEach(function (s) {
      var fundDesc = '';
      if (s.fund1 && s.fund2) fundDesc = escapeHtml(s.label1 + ': ' + s.fund1 + ', ' + s.label2 + ': ' + s.fund2);
      else if (s.fund1) fundDesc = escapeHtml(s.label1 + ': ' + s.fund1);
      else fundDesc = '<span style="color:var(--text-secondary);">TBD</span>';
      html += '<tr>' +
        '<td>' + escapeHtml(s.name) + '</td>' +
        '<td>' + escapeHtml(s.faculty) + '</td>' +
        '<td class="num">' + (s.gradYear || '—') + '</td>' +
        '<td>' + escapeHtml(s.major || '—') + '</td>' +
        '<td style="font-size:0.82rem;">' + fundDesc + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }

  html += '</div>'; // end tab-placed

  container.innerHTML = html;

  // Wire up tab clicks
  container.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      container.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      container.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });
}

function statCard(num, label) {
  return '<div class="stat-card"><div class="stat-number">' + num + '</div><div class="stat-label">' + escapeHtml(label) + '</div></div>';
}

function barRow(label, value, max, variant) {
  var pct = max > 0 ? (value / max * 100) : 0;
  var cls = 'bar-fill';
  if (variant === 'accent') cls += ' bar-fill--accent';
  else if (variant === 'success') cls += ' bar-fill--success';
  return '<div class="bar-row">' +
    '<div class="bar-label" title="' + escapeHtml(String(label)) + '">' + escapeHtml(String(label)) + '</div>' +
    '<div class="bar-track"><div class="' + cls + '" style="width:' + pct.toFixed(1) + '%;"></div></div>' +
    '<div class="bar-value">' + value + '</div></div>';
}

function monthName(n) {
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][n - 1] || '';
}

function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

loadDashboard();
</script>
</body>
</html>
