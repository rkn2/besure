<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AE Research Scholars — Program Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.2rem;
  text-align: center;
}
.stat-number {
  font-family: 'Roboto Slab', Georgia, serif;
  font-size: 2.2rem;
  font-weight: 600;
  color: var(--navy);
  line-height: 1.2;
}
.stat-label {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-top: 0.3rem;
}

.chart-section {
  margin-bottom: 2.5rem;
}
.chart-section h3 {
  font-family: 'Roboto Slab', Georgia, serif;
  font-size: 1.1rem;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 1rem;
  border-bottom: 2px solid var(--gold);
  padding-bottom: 0.4rem;
}
.bar-chart {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.bar-row {
  display: grid;
  grid-template-columns: 160px 1fr 40px;
  align-items: center;
  gap: 0.75rem;
}
.bar-label {
  font-size: 0.88rem;
  color: var(--text);
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-track {
  height: 24px;
  background: var(--sand);
  border-radius: 3px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--navy);
  border-radius: 3px;
  min-width: 2px;
  transition: width 0.4s ease;
}
.bar-fill--accent { background: var(--gold); }
.bar-fill--success { background: var(--success); }
.bar-value {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text);
  text-align: right;
}

.faculty-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  margin-top: 0.5rem;
}
.faculty-table th,
.faculty-table td {
  text-align: left;
  padding: 0.5rem 0.8rem;
  border-bottom: 1px solid var(--border);
}
.faculty-table th {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  font-weight: 600;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.faculty-table tr:hover td { background: var(--sand); }
.faculty-table td.num {
  text-align: center;
  font-weight: 600;
}
.table-wrap { overflow-x: auto; }

.loading-msg {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-secondary);
}

@media (max-width: 600px) {
  .bar-row {
    grid-template-columns: 100px 1fr 36px;
  }
  .bar-label { font-size: 0.8rem; }
  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>
<body>

<header class="hero hero--compact" style="border-bottom:2px solid var(--hero-accent);">
  <div class="hero-inner">
    <p class="hero-eyebrow">AE Research Scholars</p>
    <h1>Program Dashboard</h1>
  </div>
</header>

<section class="section">
  <div class="section-inner">
    <p style="margin-bottom:0.5rem;color:var(--text-secondary);">
      All-time applicant and placement statistics. Placements reflect students with funding recorded.
    </p>
    <p style="margin-bottom:1.5rem;">
      <button class="btn btn-secondary" onclick="loadDashboard()" style="font-size:0.82rem;padding:0.35rem 0.8rem;">Refresh</button>
    </p>

    <div id="dashboard-content">
      <p class="loading-msg">Loading data...</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <p>AE Research Scholars Program &middot; Department of Architectural Engineering &middot; Penn State</p>
</footer>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxl3x4KWmjHufkroWiXieWjBcACjWxSguj9EjonvpSxPDfVUYhfg88uhnVjRMhXuAJx/exec';
var API_KEY = 'U50J4N2YOVeJ1-LaOvlrt9hkQMNJEqet';
var OPTIONS = ['Structures', 'Mechanical / Energy', 'Lighting / Electrical', 'Construction'];

function loadDashboard() {
  var container = document.getElementById('dashboard-content');
  container.innerHTML = '<p class="loading-msg">Loading data...</p>';

  Promise.all([
    fetch(SCRIPT_URL + '?key=' + encodeURIComponent(API_KEY) + '&action=students').then(function (r) { return r.json(); }),
    fetch(SCRIPT_URL + '?key=' + encodeURIComponent(API_KEY) + '&action=placements').then(function (r) { return r.json(); })
  ])
    .then(function (results) {
      render(results[0], results[1]);
    })
    .catch(function (err) {
      console.error(err);
      container.innerHTML = '<p class="loading-msg" style="color:var(--error);">Could not load data. Check that the Apps Script is deployed.</p>';
    });
}

function render(students, placements) {
  var container = document.getElementById('dashboard-content');
  var totalApplicants = students.length;

  // Unique students placed (dedupe by email)
  var placedEmails = {};
  var placedFaculty = {};
  placements.forEach(function (p) {
    var email = (p['Student Email'] || '').toLowerCase();
    if (email) placedEmails[email] = true;
    var f = p['Faculty Name'] || '';
    if (f) placedFaculty[f] = (placedFaculty[f] || 0) + 1;
  });
  var totalPlaced = Object.keys(placedEmails).length;
  var facultyWithPlacements = Object.keys(placedFaculty).length;

  // Interest counts (High only)
  var highInterest = {};
  OPTIONS.forEach(function (o) { highInterest[o] = 0; });
  students.forEach(function (s) {
    var interests = s.interests || {};
    OPTIONS.forEach(function (o) {
      if (interests[o] === 'High') highInterest[o]++;
    });
  });

  // Graduation year counts
  var gradYears = {};
  students.forEach(function (s) {
    if (s.gradYear) {
      gradYears[s.gradYear] = (gradYears[s.gradYear] || 0) + 1;
    }
  });
  var sortedYears = Object.keys(gradYears).sort();

  // Major counts
  var majors = {};
  students.forEach(function (s) {
    var m = s.major || 'Not specified';
    majors[m] = (majors[m] || 0) + 1;
  });
  var sortedMajors = Object.keys(majors).sort(function (a, b) {
    return majors[b] - majors[a];
  });

  // Applications by month
  var byMonth = {};
  students.forEach(function (s) {
    if (s.applied) {
      var d = new Date(s.applied);
      var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      byMonth[key] = (byMonth[key] || 0) + 1;
    }
  });
  var sortedMonths = Object.keys(byMonth).sort();

  // Faculty preferences
  var withPref = students.filter(function (s) { return s.facultyPref; }).length;

  // Build HTML
  var html = '';

  // Summary cards
  html += '<div class="stat-grid">';
  html += statCard(totalApplicants, 'Total Applicants');
  html += statCard(totalPlaced, 'Students Placed');
  html += statCard(facultyWithPlacements, 'Faculty with Placements');
  html += statCard(withPref, 'Named a Faculty Pref');
  html += '</div>';

  // Interest by research area
  html += '<div class="chart-section">';
  html += '<h3>Interest by Research Area</h3>';
  html += '<p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:0.75rem;">Students who rated each area as &ldquo;High&rdquo; interest. One student can select multiple areas.</p>';
  var maxInterest = Math.max.apply(null, OPTIONS.map(function (o) { return highInterest[o]; }));
  html += '<div class="bar-chart">';
  OPTIONS.forEach(function (o) {
    html += barRow(o, highInterest[o], maxInterest || 1);
  });
  html += '</div></div>';

  // Graduation year
  if (sortedYears.length) {
    html += '<div class="chart-section">';
    html += '<h3>Graduation Year</h3>';
    var maxYear = Math.max.apply(null, sortedYears.map(function (y) { return gradYears[y]; }));
    html += '<div class="bar-chart">';
    sortedYears.forEach(function (y) {
      html += barRow(y, gradYears[y], maxYear || 1, 'accent');
    });
    html += '</div></div>';
  }

  // Major
  if (sortedMajors.length) {
    html += '<div class="chart-section">';
    html += '<h3>Major</h3>';
    var maxMajor = majors[sortedMajors[0]] || 1;
    html += '<div class="bar-chart">';
    sortedMajors.forEach(function (m) {
      html += barRow(m, majors[m], maxMajor);
    });
    html += '</div></div>';
  }

  // Applications over time
  if (sortedMonths.length) {
    html += '<div class="chart-section">';
    html += '<h3>Applications by Month</h3>';
    var maxMonth = Math.max.apply(null, sortedMonths.map(function (m) { return byMonth[m]; }));
    html += '<div class="bar-chart">';
    sortedMonths.forEach(function (m) {
      var parts = m.split('-');
      var label = monthName(parseInt(parts[1])) + ' ' + parts[0];
      html += barRow(label, byMonth[m], maxMonth || 1, 'accent');
    });
    html += '</div></div>';
  }

  // Faculty placements table
  if (Object.keys(placedFaculty).length) {
    html += '<div class="chart-section">';
    html += '<h3>Placements by Faculty</h3>';
    html += '<div class="table-wrap"><table class="faculty-table">';
    html += '<thead><tr><th>Faculty</th><th style="text-align:center;">Students</th></tr></thead><tbody>';
    var sortedFaculty = Object.keys(placedFaculty).sort(function (a, b) {
      return placedFaculty[b] - placedFaculty[a];
    });
    sortedFaculty.forEach(function (f) {
      html += '<tr><td>' + escapeHtml(f) + '</td><td class="num">' + placedFaculty[f] + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }

  container.innerHTML = html;
}

function statCard(num, label) {
  return '<div class="stat-card"><div class="stat-number">' + num + '</div><div class="stat-label">' + escapeHtml(label) + '</div></div>';
}

function barRow(label, value, max, variant) {
  var pct = max > 0 ? (value / max * 100) : 0;
  var cls = 'bar-fill';
  if (variant === 'accent') cls += ' bar-fill--accent';
  else if (variant === 'success') cls += ' bar-fill--success';
  return '<div class="bar-row">' +
    '<div class="bar-label" title="' + escapeHtml(String(label)) + '">' + escapeHtml(String(label)) + '</div>' +
    '<div class="bar-track"><div class="' + cls + '" style="width:' + pct.toFixed(1) + '%;"></div></div>' +
    '<div class="bar-value">' + value + '</div></div>';
}

function monthName(n) {
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][n - 1] || '';
}

function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

loadDashboard();
</script>
</body>
</html>
